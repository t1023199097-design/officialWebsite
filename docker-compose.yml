version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: beefintech-mysql
    environment:
      MYSQL_DATABASE: beefintech_platform
      MYSQL_USER: beefintech
      MYSQL_PASSWORD: beefintech123
      MYSQL_ROOT_PASSWORD: root123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:

